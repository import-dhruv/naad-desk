[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
exclude = [".venv", "node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
